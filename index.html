<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Click Counter</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%86%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: rgba(255, 255, 255, 0.06);
      --stroke: rgba(255, 255, 255, 0.14);
      --text: #f5f7ff;
      --muted: #9aa4c7;
      --accent: #6ee7ff;
      --accent-strong: #22c1e8;
      --accent-ink: #04202a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 10%, rgba(110, 231, 255, 0.16), transparent 42%),
        radial-gradient(circle at 85% 88%, rgba(168, 85, 247, 0.18), transparent 46%),
        var(--bg);
    }

    main {
      width: min(100%, 380px);
      padding: 32px 28px;
      text-align: center;
      border: 1px solid var(--stroke);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(10px);
    }

    h1 {
      margin: 0 0 4px;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .score {
      margin: 12px 0 24px;
      font-size: clamp(4.5rem, 22vw, 6.5rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      text-shadow: 0 0 36px rgba(110, 231, 255, 0.35);
    }

    .score.bump { animation: bump 220ms ease-out; }

    @keyframes bump {
      0% { transform: scale(1); }
      45% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    button {
      width: 100%;
      padding: 16px 20px;
      border: 0;
      border-radius: 14px;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent-ink);
      background: linear-gradient(180deg, var(--accent), var(--accent-strong));
      box-shadow: 0 10px 24px rgba(34, 193, 232, 0.35);
      cursor: pointer;
      transition: transform 120ms ease, box-shadow 120ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover { box-shadow: 0 12px 30px rgba(34, 193, 232, 0.5); }
    button:active { transform: translateY(2px) scale(0.985); box-shadow: 0 6px 14px rgba(34, 193, 232, 0.32); }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

    .hint {
      margin: 16px 0 0;
      font-size: 0.82rem;
      color: var(--muted);
    }

    @media (prefers-reduced-motion: reduce) {
      .score.bump { animation: none; }
      button { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Score</h1>
    <div class="score" id="score" role="status" aria-live="polite" aria-atomic="true">0</div>
    <button type="button" id="add">Add point</button>
    <p class="hint">Tap to count. Press Enter or Space on the button too.</p>
  </main>

  <script>
    (() => {
      const scoreEl = document.getElementById('score');
      const addButton = document.getElementById('add');
      let score = 0;

      const render = () => {
        scoreEl.textContent = String(score);
        scoreEl.classList.remove('bump');
        void scoreEl.offsetWidth;
        scoreEl.classList.add('bump');
      };

      addButton.addEventListener('click', () => {
        score += 1;
        render();
      });
    })();
  </script>
</body>
</html>
