name: Mac tunnel DNS regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/setup-mac-dns.sh
      - scripts/setup-mac-dns.test.mjs
      - scripts/mac-dns-recovery.mjs
      - scripts/public-readiness.mjs
      - scripts/smoke-mac-tunnel.mjs
      - .github/workflows/opencode-reusable.yml
      - .github/workflows/mac-tunnel-smoke.yml
permissions:
  contents: read
jobs:
  tunnel:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test DNS setup and readiness contracts
        run: /usr/bin/time -p node --test scripts/setup-mac-dns.test.mjs scripts/public-readiness.test.mjs scripts/mac-dns-recovery.test.mjs
      - name: Configure Mac runner DNS
        run: /usr/bin/time -p bash scripts/setup-mac-dns.sh
      - name: Install cloudflared
        run: /usr/bin/time -p brew install cloudflared
      - name: Verify a fresh tunnel with normal DNS
        run: /usr/bin/time -p node scripts/smoke-mac-tunnel.mjs
      - name: Diagnose resolver failures
        if: failure()
        run: /usr/bin/time -p scutil --dns
