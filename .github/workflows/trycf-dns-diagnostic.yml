name: Diagnose Cloudflare Quick Tunnel DNS

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Diagnose trycloudflare DNS on macOS
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Install cloudflared
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cloudflared >/dev/null 2>&1; then
            time brew install cloudflared
          fi
          cloudflared --version

      - name: Start origin and tunnel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trycf"
          printf 'trycf diagnostic\n' > "$RUNNER_TEMP/trycf/index.html"
          (cd "$RUNNER_TEMP/trycf" && time python3 -m http.server 3000 --bind 127.0.0.1 > "$RUNNER_TEMP/trycf/origin.log" 2>&1 & echo $! > "$RUNNER_TEMP/trycf/origin.pid")
          for _ in {1..30}; do
            curl --fail --silent --show-error --max-time 2 http://127.0.0.1:3000/ >/dev/null && break
            sleep 1
          done
          time curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/ >/dev/null
          (time cloudflared tunnel --no-autoupdate --url http://127.0.0.1:3000 > "$RUNNER_TEMP/trycf/cloudflared.log" 2>&1 & echo $! > "$RUNNER_TEMP/trycf/cloudflared.pid")

      - name: Compare resolver paths
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/trycf/cloudflared.log"
          url=''
          for _ in {1..60}; do
            url="$(sed -nE 's#.*(https://[a-z0-9-]+\.trycloudflare\.com).*#\1#p' "$log" | head -n 1)"
            [[ -n "$url" ]] && break
            sleep 1
          done
          [[ -n "$url" ]] || { cat "$log"; exit 1; }
          host="${url#https://}"
          echo "URL=$url"
          echo '--- system resolver ---'
          dscacheutil -q host -a name "$host" || true
          dig +short A "$host" || true
          echo '--- authoritative resolver ---'
          ips=''
          for _ in {1..90}; do
            ips="$(dig @1.1.1.1 +short A "$host" | awk '/^[0-9]+(\.[0-9]+){3}$/ { print }')"
            [[ -n "$ips" ]] && break
            sleep 2
          done
          printf '%s\n' "$ips"
          echo '--- default curl ---'
          if curl --fail --silent --show-error --max-time 10 "$url/"; then
            echo
            echo 'Default resolver/curl: PASS'
          else
            echo 'Default resolver/curl: FAIL (expected when runner DNS is stale)'
          fi
          echo '--- result ---'
          if [[ -n "$ips" ]]; then
            echo 'Cloudflare DNS has an answer; compare this with the system resolver above.'
          else
            echo 'Cloudflare authoritative DNS also has no answer.'
            exit 1
          fi

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trycf-dns-diagnostic
          path: ${{ runner.temp }}/trycf
