name: OpenCode
run-name: "OpenCode #${{ github.event.issue.number || inputs.issue_number }}${{ github.event.issue.title && format(' — {0}', github.event.issue.title) || '' }}"

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing issue to run
        required: true
        type: string

permissions:
  id-token: write
  contents: write
  issues: write
  actions: write

concurrency:
  group: opencode-issue-${{ github.repository }}-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'OpenCode')
    uses: ./.github/workflows/opencode-prepare.yml
    with:
      runtime_ref: ${{ github.workflow_sha }}

  opencode:
    needs: prepare
    if: needs.prepare.outputs.approved == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Sign in to OpenCode
        env:
          AUDIENCE: https://opencode.ai
        run: |
          oidc=$(curl -sSf --oauth2-bearer "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          token=$(curl -sSf https://opencode.ai/auth/oauth/token \
            -d grant_type=urn:ietf:params:oauth:grant-type:token-exchange \
            -d subject_token_type=urn:ietf:params:oauth:token-type:jwt \
            -d client_id=sk_107ed9ff-00c9-41bb-814e-afd96dff0173 \
            -d subject_token="$oidc" | jq -r .access_token)
          echo "::add-mask::$token"
          echo "OPENCODE_API_KEY=$token" >> "$GITHUB_ENV"

      - name: Run Reusable OpenCode Workflow
        uses: ./.github/workflows/opencode-reusable.yml
        with:
          runtime_ref: ${{ github.workflow_sha }}
          issue_number: ${{ needs.prepare.outputs.issue_number }}
          request: ${{ needs.prepare.outputs.request }}
          issue_title: ${{ needs.prepare.outputs.issue_title }}
          labels_json: ${{ needs.prepare.outputs.labels_json }}
          sender: ${{ needs.prepare.outputs.sender }}
          target_ref: ${{ needs.prepare.outputs.target_ref }}
          target_sha: ${{ needs.prepare.outputs.target_sha }}
        secrets: inherit
