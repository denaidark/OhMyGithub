name: Validate Cloudflare Quick Tunnel Resolution Fix

on:
  workflow_dispatch:

jobs:
  validate:
    name: Validate tunnel health strategies on macOS
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Install cloudflared
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cloudflared >/dev/null 2>&1; then
            time brew install cloudflared
          fi
          cloudflared --version

      - name: Start origin and tunnel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trycf"
          printf 'trycf resolution fix\n' > "$RUNNER_TEMP/trycf/index.html"
          (cd "$RUNNER_TEMP/trycf" && time python3 -m http.server 3000 --bind 127.0.0.1 > "$RUNNER_TEMP/trycf/origin.log" 2>&1 & echo $! > "$RUNNER_TEMP/trycf/origin.pid")
          for _ in {1..30}; do
            curl --fail --silent --show-error --max-time 2 http://127.0.0.1:3000/ >/dev/null && break
            sleep 1
          done
          time curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/ >/dev/null
          (time cloudflared tunnel --no-autoupdate --url http://127.0.0.1:3000 > "$RUNNER_TEMP/trycf/cloudflared.log" 2>&1 & echo $! > "$RUNNER_TEMP/trycf/cloudflared.pid")

      - name: Test authoritative DNS, hosts pin, and curl resolve
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/trycf/cloudflared.log"
          url=''
          for _ in {1..60}; do
            url="$(sed -nE 's#.*(https://[a-z0-9-]+\.trycloudflare\.com).*#\1#p' "$log" | head -n 1)"
            [[ -n "$url" ]] && break
            sleep 1
          done
          [[ -n "$url" ]] || { cat "$log"; exit 1; }
          host="${url#https://}"
          ips=''
          for _ in {1..90}; do
            ips="$(dig @1.1.1.1 +short A "$host" | awk '/^[0-9]+(\.[0-9]+){3}$/ { print }')"
            [[ -n "$ips" ]] && break
            sleep 2
          done
          [[ -n "$ips" ]] || { echo "No authoritative DNS answer for $host"; exit 1; }
          echo "URL=$url"
          echo "IPs=$ips"

          echo '--- strategy: curl --resolve ---'
          resolve_args=()
          while IFS= read -r ip; do
            [[ -z "$ip" ]] || resolve_args+=(--resolve "$host:443:$ip")
          done <<< "$ips"
          time curl --fail --silent --show-error --max-time 10 "${resolve_args[@]}" "$url/"
          echo

          echo '--- strategy: /etc/hosts pin ---'
          while IFS= read -r ip; do
            [[ -z "$ip" ]] || echo "$ip $host" | sudo tee -a /etc/hosts >/dev/null
          done <<< "$ips"
          time curl --fail --silent --show-error --max-time 10 "$url/"
          echo

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trycf-resolution-fix
          path: ${{ runner.temp }}/trycf
